<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadara - Custom Garment & Launch Enquiry</title>
    <meta name="description" content="Enquire about custom modest garments, special occasion wear, and pre-launch orders with Hadara.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Hadara</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact us.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Custom Garment &amp; Launch Enquiry</h2>
        <p>Interested in our pre-launch custom orders or matching mother-daughter sets? Fill out the form below:</p>

        <form id="enquiryForm" action="#" method="post">
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="category">Product Category Interest:</label><br>
            <select id="category" name="category">
                <option value="casual">Modest Casual Wear</option>
                <option value="evening">Modest Evening Wear</option>
                <option value="girls">Little Girls' Wear</option>
                <option value="custom">Custom Garment Order</option>
            </select><br><br>

            <label for="message">Enquiry Details:</label><br>
            <textarea id="message" name="message" rows="5" cols="40" required></textarea><br><br>

            <input type="submit" value="Submit Enquiry">
        </form>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Hadara Modest Fashion. All Rights Reserved.</p>
    </footer>
    <script src="script.js" defer></script>
</body>
</html>
